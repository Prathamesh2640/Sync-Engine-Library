[versions]
agp = "9.2.1"
coroutines = "1.8.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
material = "1.10.0"
room = "2.7.1"
# Retrofit — used only in :sync-network-retrofit (OkHttp comes transitively).
retrofit = "2.11.0"
# OkHttp MockWebServer — test-only, exercises the adapter over real HTTP on the JVM.
okhttp = "4.12.0"
# KSP release string is "<kotlin>-<ksp>", pinned to Kotlin 2.1.0 by KSP's own
# versioning scheme — that does NOT mean the project's Kotlin is 2.1.0. AGP
# 9.2.1's built-in Kotlin compiler is actually 2.2.10 (see README/SETUP); this
# KSP release is verified working against it (SETUP.md's KSP troubleshooting
# entry). Bump only if a real KSP/Room codegen failure demands it.
ksp = "2.1.0-1.0.29"
# AndroidX Test — provides ApplicationProvider + the AndroidJUnit4 runner that
# delegates to Robolectric when the tests run on the JVM (local unit tests).
androidxTestCore = "1.5.0"
# Robolectric — runs Room DAO/adapter tests on the JVM (no device/emulator),
# so :sync-storage-room tests execute under testDebugUnitTest and in CI.
robolectric = "4.14.1"
# WorkManager — used only in :sync-workmanager for periodic background sync.
work = "2.10.0"
# Jetpack Compose — :sync-ui-dashboard (debug dashboard) + :sample-app UI.
# The BOM aligns every Compose artifact; individual libs omit versions.
composeBom = "2024.10.00"
activityCompose = "1.9.3"
lifecycleRuntimeCompose = "2.8.7"
# Compose compiler Gradle plugin — must track the Kotlin version (2.1.0). With
# AGP 9 built-in Kotlin, this applies the Compose compiler without the standalone
# Kotlin Android plugin (ADL-005 stays honored).
composeCompiler = "2.1.0"
# Turbine — Flow-testing helper for StateFlow emission assertions (F-15).
turbine = "1.1.0"
# vanniktech Maven Central Portal publishing plugin (F-18/F-19) — hides the POM/
# signing/upload boilerplate behind a `mavenPublishing {}` DSL.
mavenPublish = "0.37.0"
# Dokka 1.9.x (not 2.x): stable, well-documented Gradle DSL for the
# `dokkaHtmlMultiModule` aggregation task (F-23) and vanniktech's automatic
# javadoc.jar detection; fully compatible with the Kotlin 2.1.0 compiler used
# here (F-18).
dokka = "1.9.20"

[libraries]
# AndroidX — used in Android modules only (NOT in :sync-core)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Kotlin Coroutines
# sync-core exposes Flow in its public API, so it uses api() — consumers get this transitively
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Room — used only in :sync-storage-room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# WorkManager — used only in :sync-workmanager. work-testing is a test-only
# fixture driving SyncWorker via WorkManagerTestInitHelper on the JVM.
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# Jetpack Compose — versions come from the BOM (androidx-compose-bom).
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

# Retrofit — used only in :sync-network-retrofit (main uses retrofit for Response/
# HTTP mapping; the gson converter + mockwebserver are test-only fixtures).
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# JVM Room test runtime: ApplicationProvider (test-core) + Robolectric, run under
# testDebugUnitTest via the AndroidJUnit4 -> Robolectric delegation.
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# KSP — Room annotation processing (replaces annotationProcessor, ADL-003).
# Applied in :sync-storage-room only; declared apply-false at the root.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Compose compiler — applied in Compose modules (:sync-ui-dashboard, :sample-app).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
# Maven Central Portal publishing — applied only in the 5 publishable modules,
# never in :sample-app (module-guide: the sample app is never published).
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
# Dokka — applied at root (multi-module aggregation) and in every publishable
# module (per-module API docs + vanniktech's javadoc.jar auto-detection).
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
