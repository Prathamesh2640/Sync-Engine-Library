[versions]
agp = "9.2.1"
kotlin = "2.1.0"
coroutines = "1.8.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
room = "2.7.1"
# Retrofit — used only in :sync-network-retrofit (OkHttp comes transitively).
retrofit = "2.11.0"
# OkHttp MockWebServer — test-only, exercises the adapter over real HTTP on the JVM.
okhttp = "4.12.0"
# KSP release string is "<kotlin>-<ksp>"; must track the Kotlin version (2.1.0).
ksp = "2.1.0-1.0.29"
# AndroidX Test — provides ApplicationProvider + the AndroidJUnit4 runner that
# delegates to Robolectric when the tests run on the JVM (local unit tests).
androidxTestCore = "1.5.0"
# Robolectric — runs Room DAO/adapter tests on the JVM (no device/emulator),
# so :sync-storage-room tests execute under testDebugUnitTest and in CI.
robolectric = "4.14.1"

[libraries]
# AndroidX — used in Android modules only (NOT in :sync-core)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Kotlin Coroutines
# sync-core exposes Flow in its public API, so it uses api() — consumers get this transitively
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Room — used only in :sync-storage-room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Retrofit — used only in :sync-network-retrofit (main uses retrofit for Response/
# HTTP mapping; the gson converter + mockwebserver are test-only fixtures).
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# JVM Room test runtime: ApplicationProvider (test-core) + Robolectric, run under
# testDebugUnitTest via the AndroidJUnit4 -> Robolectric delegation.
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# KSP — Room annotation processing (replaces annotationProcessor, ADL-003).
# Applied in :sync-storage-room only; declared apply-false at the root.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
