version: 2
updates:
  # gradle/libs.versions.toml — the version catalog every module dependency
  # goes through (Kotlin Library Rules: no inline version strings).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      test-only:
        patterns:
          - "junit:junit"
          - "androidx.test*"
          - "org.robolectric:*"
          - "app.cash.turbine:*"
    ignore:
      # Toolchain pins — load-bearing, see CLAUDE.md / ADL-005 / ADL-021.
      # Revisit deliberately, not via an auto-PR.
      - dependency-name: "com.android.*"
      - dependency-name: "androidx.room:*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "org.jetbrains.dokka*"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose*"
      - dependency-name: "com.vanniktech.maven.publish*"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "androidx.core:core-ktx"
      - dependency-name: "androidx.work:*"
      # Public-API surface — a major bump is a breaking change for consumers.
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]

  # Keep the workflow actions themselves (checkout, setup-java, setup-gradle,
  # upload-artifact, actions-gh-pages) patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
