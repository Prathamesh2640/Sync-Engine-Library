name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests (all modules)
        run: ./gradlew test

      - name: Assemble debug (libraries + sample-app)
        run: ./gradlew assembleDebug

      # module-guide: the sample app must build in release mode (minification
      # on) in CI to catch consumer-rules.pro / R8 issues early.
      - name: Assemble sample-app release (R8/ProGuard check)
        run: ./gradlew :sample-app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14
